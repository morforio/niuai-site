<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload de Contatos - Talisman Seguros</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }

        body {
            font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
            background: linear-gradient(135deg,#1e5a9e 0%,#c41e3a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }

        .logo-container { text-align:center; margin-bottom:30px; }
        .logo-container img { max-width:250px; height:auto; }

        h1 { color:#333; text-align:center; margin-bottom:10px; font-size:28px; }
        .subtitle { text-align:center; color:#666; margin-bottom:30px; font-size:14px; }

        .drop-zone {
            border:3px dashed #ccc;
            border-radius:15px;
            padding:50px 20px;
            text-align:center;
            cursor:pointer;
            background:#f9f9f9;
            margin-bottom:20px;
            transition:all 0.3s ease;
        }

        .drop-zone:hover,
        .drop-zone.dragover { border-color:#1e5a9e; background:#e8f2fb; }

        .drop-zone-icon { font-size:48px; margin-bottom:15px; color:#1e5a9e; }
        .drop-zone-text { color:#666; font-size:16px; margin-bottom:10px; }
        .drop-zone-hint { color:#999; font-size:13px; }

        .file-input { display:none; }

        .btn {
            width:100%;
            padding:14px;
            border:none;
            border-radius:10px;
            font-size:16px;
            font-weight:600;
            cursor:pointer;
            transition:all 0.3s ease;
            text-transform:uppercase;
            letter-spacing:0.5px;
            margin-bottom:10px;
        }

        .btn-primary {
            background:linear-gradient(135deg,#1e5a9e 0%,#c41e3a 100%);
            color:white;
        }

        .btn-primary:hover:not(:disabled) {
            transform:translateY(-2px);
            box-shadow:0 10px 25px rgba(30,90,158,0.4);
        }

        .btn-primary:disabled { background:#ccc; cursor:not-allowed; }

        .btn-secondary { background:#f0f0f0; color:#666; }
        .btn-secondary:hover { background:#e0e0e0; }

        .preview-container {
            margin:20px 0;
            padding:20px;
            background:#f9f9f9;
            border-radius:10px;
            display:none;
        }

        .preview-container.show { display:block; }

        .file-info-item {
            display:flex;
            justify-content:space-between;
            padding:8px 0;
            border-bottom:1px solid #e0e0e0;
        }

        .file-info-item:last-child { border-bottom:none; }
        .file-info-label { color:#666; font-size:14px; }
        .file-info-value { color:#333; font-weight:500; font-size:14px; }

        .alert {
            padding:15px;
            border-radius:10px;
            margin-bottom:20px;
            display:none;
        }

        .alert.show { display:block; }

        .alert-success { background:#d4edda; color:#155724; border:1px solid #c3e6cb; }
        .alert-error { background:#f8d7da; color:#721c24; border:1px solid #f5c6cb; }
        .alert-warning { background:#fff3cd; color:#856404; border:1px solid #ffeaa7; }

        .loading { display:none; text-align:center; padding:20px; }
        .loading.show { display:block; }

        .spinner {
            border:4px solid #f3f3f3;
            border-top:4px solid #1e5a9e;
            border-radius:50%;
            width:40px;
            height:40px;
            animation:spin 1s linear infinite;
            margin:0 auto 15px;
        }

        @keyframes spin { 0%{transform:rotate(0deg);}100%{transform:rotate(360deg);} }
    </style>
</head>
<body>
    <!-- Tela única (login removido) -->
    <div class="container" id="uploadScreen">
        <div class="logo-container">
            <img src="talisman-logo.png" alt="Talisman Seguros">
        </div>
        
        <h1>Upload de Contatos</h1>
        <p class="subtitle">Talisman Seguros - Envie sua planilha Excel</p>

        <div class="drop-zone" id="dropZone">
            <div class="drop-zone-icon">📊</div>
            <div class="drop-zone-text">Arraste o arquivo Excel aqui</div>
            <div class="drop-zone-hint">ou clique para selecionar</div>
            <input type="file" id="fileInput" class="file-input" accept=".xlsx,.xls,.csv">
        </div>

        <div class="preview-container" id="previewContainer">
            <div style="font-weight:600;margin-bottom:10px;">📋 Preview</div>
            <div id="fileInfo"></div>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <div>Enviando arquivo...</div>
        </div>

        <button class="btn btn-primary" id="uploadBtn" onclick="uploadFile()" disabled>Enviar para CRM</button>

        <div class="alert" id="alertBox"></div>

        <button class="btn btn-secondary" onclick="resetUpload()">Limpar e Enviar Outro</button>
    </div>

    <script>
        let fileData = null;
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');

        dropZone.addEventListener('click',()=>fileInput.click());
        dropZone.addEventListener('dragover',(e)=>{e.preventDefault();dropZone.classList.add('dragover');});
        dropZone.addEventListener('dragleave',()=>dropZone.classList.remove('dragover'));
        dropZone.addEventListener('drop',(e)=>{
            e.preventDefault();dropZone.classList.remove('dragover');
            if(e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
        });
        fileInput.addEventListener('change',(e)=>{
            if(e.target.files.length) handleFile(e.target.files[0]);
        });

        function handleFile(file){
            const valid=[
                'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',
                'application/vnd.ms-excel','text/csv'
            ];
            if(!valid.includes(file.type)&&!file.name.match(/\.(xlsx|xls|csv)$/i)){
                showAlert('Formato inválido.','error');return;
            }

            const reader=new FileReader();
            reader.onload=(e)=>{
                try{
                    const base64=btoa(String.fromCharCode.apply(null,new Uint8Array(e.target.result)));
                    fileData={filename:file.name,size:file.size,base64:base64};
                    const fileInfo=document.getElementById('fileInfo');
                    fileInfo.innerHTML=`
                        <div class="file-info-item"><span class="file-info-label">Nome:</span><span class="file-info-value">${file.name}</span></div>
                        <div class="file-info-item"><span class="file-info-label">Tamanho:</span><span class="file-info-value">${(file.size/1024).toFixed(2)} KB</span></div>
                        <div class="file-info-item"><span class="file-info-label">Status:</span><span class="file-info-value" style="color:#28a745;">✅ Pronto</span></div>`;
                    document.getElementById('previewContainer').classList.add('show');
                    document.getElementById('uploadBtn').disabled=false;
                    showAlert('Arquivo carregado!','success');
                }catch(err){
                    showAlert('Erro: '+err.message,'error');
                }
            };
            reader.readAsArrayBuffer(file);
        }

        async function uploadFile(){
            if(!fileData)return;
            document.getElementById('loading').classList.add('show');
            document.getElementById('uploadBtn').disabled=true;
            try{
                const binaryString=atob(fileData.base64);
                const bytes=new Uint8Array(binaryString.length);
                for(let i=0;i<binaryString.length;i++) bytes[i]=binaryString.charCodeAt(i);
                await fetch('https://webhook.niuai.com.br/webhook/webhook-talisman-lista-excel',{method:'POST',body:bytes});
                showAlert('✅ Arquivo enviado com sucesso!','success');
                setTimeout(()=>resetUpload(),2000);
            }catch(error){
                showAlert('❌ Erro: '+error.message,'error');
                document.getElementById('uploadBtn').disabled=false;
            }finally{
                document.getElementById('loading').classList.remove('show');
            }
        }

        function resetUpload(){
            fileData=null;fileInput.value='';
            document.getElementById('previewContainer').classList.remove('show');
            document.getElementById('uploadBtn').disabled=true;
        }

        function showAlert(msg,type){
            const box=document.getElementById('alertBox');
            box.className=`alert alert-${type} show`;
            box.textContent=msg;
            setTimeout(()=>box.classList.remove('show'),5000);
        }
    </script>
</body>
</html>
