<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <title>Upload de Contatos • Widget Kommo</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="//fonts.googleapis.com/css?family=PT+Sans:400,700|Open+Sans:400" />
  <style>
    :root { --bg:#0f2a3a; --card:#122f40; --ink:#e7f1f7; --muted:#8fb3c7; --ok:#41cfc4; --err:#fe6e6e; }
    *{box-sizing:border-box} html,body{margin:0;padding:0;font-family:'PT Sans',sans-serif;color:var(--ink);background:linear-gradient(180deg,#0e2748 0,#0a223f 100%)}
    .cell-wrapper{padding:18px 14px}
    .title{font-weight:700;font-size:15px;margin:0 0 10px}
    .card{background:var(--card);border-radius:10px;padding:14px;border:1px solid rgba(255,255,255,.06)}
    .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .field{flex:1;min-width:220px}
    label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
    input[type="file"], input[type="text"]{width:100%;padding:10px 12px;border-radius:8px;border:1px solid rgba(255,255,255,.12);background:#0b2230;color:var(--ink);font-family:inherit}
    .hint{font-size:11px;color:var(--muted);margin-top:6px}
    button{appearance:none;border:0;border-radius:10px;padding:10px 14px;font-weight:700;background:#1b97f3;color:white;cursor:pointer}
    button[disabled]{opacity:.6;cursor:not-allowed}
    .status{margin-top:12px;font-family:'Open Sans',sans-serif;font-size:14px}
    .ok{color:var(--ok)} .err{color:var(--err)} .muted{color:var(--muted)}
    progress{width:100%;height:10px;border:0;border-radius:8px;background:#0b2230;margin-top:8px}
    progress::-webkit-progress-bar{background:#0b2230;border-radius:8px}
    progress::-webkit-progress-value{border-radius:8px;background:#1b97f3}
    .small{font-size:11px;margin-top:10px;color:var(--muted)}
    a{color:inherit}
  </style>
</head>
<body>
  <div class="cell-wrapper">
    <h1 class="title">Enviar lista de contatos (Excel)</h1>

    <div class="card">
      <div class="row">
        <div class="field">
          <label>Arquivo .xlsx ou .xls</label>
          <input id="file" type="file" accept=".xlsx,.xls,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet">
          <div class="hint">Máx. 25 MB. Uma aba. Cabeçalho na primeira linha.</div>
        </div>
        <div class="field">
          <label>Nome da campanha (opcional)</label>
          <input id="campaign" type="text" placeholder="Ex.: Renovação Outubro">
        </div>
        <div>
          <label>&nbsp;</label>
          <button id="send">Enviar para o n8n</button>
        </div>
      </div>

      <progress id="bar" value="0" max="100" hidden></progress>
      <div id="status" class="status muted">Aguardando arquivo.</div>
      <div class="small">Após sucesso o n8n processa e cria os leads no Kommo.</div>
    </div>
  </div>

  <script>
    // Trocar pelo seu webhook público do n8n (método POST)
    const WEBHOOK_URL = "https://webhook.niuai.com.br/webhook/webhook-talisman-lista-excel";

    const $ = (q)=>document.querySelector(q);
    const file = $("#file");
    const campaign = $("#campaign");
    const sendBtn = $("#send");
    const bar = $("#bar");
    const statusEl = $("#status");

    function setStatus(text, cls="muted"){
      statusEl.className = "status " + cls;
      statusEl.textContent = text;
    }

    file.addEventListener("change", ()=>{
      if(!file.files.length) { setStatus("Aguardando arquivo.","muted"); return; }
      const f = file.files[0];
      const okTypes = [
        "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
        "application/vnd.ms-excel"
      ];
      if(!okTypes.includes(f.type) && !/\.(xlsx|xls)$/i.test(f.name)){
        setStatus("Formato inválido. Selecione .xlsx ou .xls.","err"); file.value=""; return;
      }
      if(f.size > 25*1024*1024){ setStatus("Arquivo acima de 25 MB.","err"); return; }
      setStatus(`Pronto para enviar: ${f.name} (${(f.size/1024/1024).toFixed(1)} MB).`,"muted");
    });

    async function upload(){
      if(!file.files.length){ setStatus("Selecione um arquivo antes de enviar.","err"); return; }
      sendBtn.disabled = true;
      bar.hidden = false; bar.value = 10;
      setStatus("Enviando...","muted");

      try{
        const fd = new FormData();
        fd.append("file", file.files[0]);                  // n8n receberá binary -> data
        fd.append("filename", file.files[0].name);
        fd.append("campaign", campaign.value || "");
        fd.append("kommo_period", new URLSearchParams(location.search).get("kommo_period") || "");
        fd.append("source", "kommo_widget");

        // fetch básico; n8n aceitará multipart/form-data
        const res = await fetch(WEBHOOK_URL, { method:"POST", body: fd });

        bar.value = 80;
        if(!res.ok){
          const txt = await res.text().catch(()=>res.statusText);
          throw new Error(`HTTP ${res.status} · ${txt?.slice(0,200)}`);
        }

        // opcional: ler JSON de retorno
        let payloadText = "";
        try {
          const data = await res.json();
          payloadText = data?.message || "Upload recebido.";
        } catch { payloadText = "Upload recebido."; }

        bar.value = 100;
        setStatus(`Sucesso: ${payloadText}`, "ok");

        // limpar estado
        setTimeout(()=>{ bar.hidden = true; bar.value = 0; sendBtn.disabled = false; }, 600);
      }catch(err){
        setStatus(`Falha no envio: ${err.message}`, "err");
        bar.hidden = true; bar.value = 0; sendBtn.disabled = false;
      }
    }

    sendBtn.addEventListener("click", upload);
  </script>
</body>
</html>
