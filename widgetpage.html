<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Upload de Contatos - Talisman Seguros</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:linear-gradient(135deg,#1e5a9e 0%,#c41e3a 100%);
  height:100vh;width:100vw;display:flex;align-items:center;justify-content:center;
}
.container{
  background:#fff;border-radius:20px;box-shadow:0 12px 40px rgba(0,0,0,.25);
  width:100%;max-width:440px;aspect-ratio:1/1;
  display:flex;flex-direction:column;align-items:center;justify-content:space-between;
  padding:20px 26px;overflow:hidden;
}
.logo-container img{max-width:180px;height:auto;margin-top:4px}
h1{color:#333;text-align:center;margin:6px 0 4px;font-size:22px;line-height:1.2}
.subtitle{text-align:center;color:#666;margin-bottom:8px;font-size:13px}
.drop-zone{
  border:3px dashed #ccc;border-radius:14px;
  flex:1;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  cursor:pointer;background:#f9f9f9;transition:.25s;margin:4px 0 8px;
}
.drop-zone:hover,.drop-zone.dragover{border-color:#1e5a9e;background:#e8f2fb}
.drop-zone-icon{font-size:40px;margin-bottom:8px;color:#1e5a9e}
.drop-zone-text{color:#555;font-size:14px;margin-bottom:4px}
.drop-zone-hint{color:#999;font-size:12px}
.file-input{display:none}
.preview-container{
  background:#f7f7f7;border-radius:10px;padding:10px;margin-top:6px;width:100%;flex-shrink:0;
  display:none;overflow:hidden;
}
.preview-container.show{display:block}
.file-info-item{display:flex;justify-content:space-between;font-size:13px;padding:4px 0;border-bottom:1px solid #eee}
.file-info-item:last-child{border-bottom:none}
.file-info-value{font-weight:600;color:#333}
.alert{padding:10px;border-radius:8px;margin-top:8px;font-size:13px;text-align:center;display:none}
.alert.show{display:block}
.alert-success{background:#d4edda;color:#155724;border:1px solid #c3e6cb}
.alert-error{background:#f8d7da;color:#721c24;border:1px solid #f5c6cb}
.loading{text-align:center;margin-top:8px;display:none}
.loading.show{display:block}
.spinner{border:3px solid #f3f3f3;border-top:3px solid #1e5a9e;border-radius:50%;
  width:28px;height:28px;animation:spin 1s linear infinite;margin:0 auto 10px}
@keyframes spin{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
.btn{
  width:100%;padding:12px;border:none;border-radius:10px;
  font-weight:600;font-size:15px;cursor:pointer;margin-top:6px;
  text-transform:uppercase;transition:.25s;
}
.btn-primary{background:linear-gradient(135deg,#1e5a9e 0%,#c41e3a 100%);color:white}
.btn-primary:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 8px 20px rgba(30,90,158,.35)}
.btn-primary:disabled{background:#ccc;cursor:not-allowed}
.btn-secondary{background:#f0f0f0;color:#666}
.btn-secondary:hover{background:#e0e0e0}
</style>
</head>
<body>
  <div class="container" id="uploadScreen">
    <div class="logo-container">
      <img src="images/logo-hd.png" alt="Talisman Seguros">
    </div>

    <h1>Upload de Contatos</h1>
    <p class="subtitle">Talisman Seguros · Envie sua planilha Excel</p>

    <div class="drop-zone" id="dropZone">
      <div class="drop-zone-icon">📊</div>
      <div class="drop-zone-text">Arraste o arquivo Excel aqui</div>
      <div class="drop-zone-hint">ou clique para selecionar</div>
      <input type="file" id="fileInput" class="file-input" accept=".xlsx,.xls,.csv">
    </div>

    <div class="preview-container" id="previewContainer">
      <div id="fileInfo"></div>
    </div>

    <div class="loading" id="loading">
      <div class="spinner"></div>
      <div>Enviando arquivo...</div>
    </div>

    <button class="btn btn-primary" id="uploadBtn" onclick="uploadFile()" disabled>Enviar</button>
    <div class="alert" id="alertBox"></div>
    <button class="btn btn-secondary" onclick="resetUpload()">Limpar</button>
  </div>

<script>
let fileData=null;
const dz=document.getElementById('dropZone');
const fi=document.getElementById('fileInput');
dz.addEventListener('click',()=>fi.click());
dz.addEventListener('dragover',e=>{e.preventDefault();dz.classList.add('dragover')});
dz.addEventListener('dragleave',()=>dz.classList.remove('dragover'));
dz.addEventListener('drop',e=>{
  e.preventDefault();dz.classList.remove('dragover');
  if(e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
});
fi.addEventListener('change',e=>{if(e.target.files.length) handleFile(e.target.files[0])});

function handleFile(f){
  const ok=[
    'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',
    'application/vnd.ms-excel','text/csv'
  ];
  if(!ok.includes(f.type)&&!f.name.match(/\.(xlsx|xls|csv)$/i)){show('Formato inválido.','error');return;}
  const r=new FileReader();
  r.onload=e=>{
    const b64=btoa(String.fromCharCode.apply(null,new Uint8Array(e.target.result)));
    fileData={filename:f.name,size:f.size,base64:b64};
    document.getElementById('fileInfo').innerHTML=`
      <div class="file-info-item"><span>Nome</span><span class="file-info-value">${f.name}</span></div>
      <div class="file-info-item"><span>Tamanho</span><span class="file-info-value">${(f.size/1024).toFixed(2)} KB</span></div>
      <div class="file-info-item"><span>Status</span><span class="file-info-value" style="color:#28a745">✅ Pronto</span></div>`;
    document.getElementById('previewContainer').classList.add('show');
    document.getElementById('uploadBtn').disabled=false;
    show('Arquivo carregado.','success');
  };
  r.readAsArrayBuffer(f);
}

async function uploadFile(){
  if(!fileData)return;
  document.getElementById('loading').classList.add('show');
  document.getElementById('uploadBtn').disabled=true;
  try{
    const bin=atob(fileData.base64);
    const bytes=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
    await fetch('https://webhook.niuai.com.br/webhook/webhook-talisman-lista-excel',{method:'POST',body:bytes});
    show('✅ Enviado com sucesso.','success');
    setTimeout(()=>resetUpload(),1500);
  }catch(e){
    show('❌ Erro: '+e.message,'error');
    document.getElementById('uploadBtn').disabled=false;
  }finally{
    document.getElementById('loading').classList.remove('show');
  }
}

function resetUpload(){
  fileData=null;fi.value='';
  document.getElementById('previewContainer').classList.remove('show');
  document.getElementById('uploadBtn').disabled=true;
}

function show(msg,t){
  const b=document.getElementById('alertBox');
  b.className=`alert alert-${t} show`;
  b.textContent=msg;
  setTimeout(()=>b.classList.remove('show'),4000);
}
</script>
</body>
</html>
